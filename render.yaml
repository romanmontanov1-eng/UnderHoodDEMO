# Optional reproducible configuration for the standalone CMS service only.
services:
  - type: web
    name: underhood-admin
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    repo: https://github.com/romanmontanov1-eng/UnderHoodDEMO
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r cms/requirements.txt
    startCommand: gunicorn --no-control-socket --workers 1 --threads 2 --timeout 90 --bind 0.0.0.0:$PORT 'cms.app:create_app()'
    healthCheckPath: /api/health
    disk:
      name: underhood-cms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: REQUIRE_PERSISTENT_DISK
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_SITE_URL
        value: https://underhood-detailing.onrender.com
      - key: CMS_ORIGIN
        value: https://underhood-admin.onrender.com
      - key: ADMIN_EMAIL
        value: romanmontanov1@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
