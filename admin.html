<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Управление сайтом · GT Detailing</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#263020;background:#f6f4ef}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a4696c;outline-offset:3px}header{background:#141a12;color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:5}.brand{font-weight:700;font-size:23px}.brand span{font-size:11px;font-weight:400;color:#78353a;margin-left:10px}button,.btn{border:1px solid #bdc8b1;background:transparent;color:inherit;border-radius:6px;padding:11px 16px;display:inline-block}.primary{background:#78353a;color:#ffffff;border-color:#78353a;font-weight:700}header .actions{display:flex;gap:10px;align-items:center}header .btn{border-color:#56614b}.layout{display:grid;grid-template-columns:210px 1fr;gap:40px;max-width:1300px;margin:auto;padding:40px 5%}.side{position:sticky;top:110px;align-self:start}.side button{display:block;border:0;width:100%;text-align:left;padding:14px;border-radius:5px;color:#526346}.side button.active{background:#eee2dd;color:#78353a;font-weight:700}.side p{font-size:11px;line-height:1.7;color:#728467;margin:30px 14px}.panel{background:white;padding:30px;border:1px solid #dbe0d5;border-radius:10px;margin-bottom:20px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 12px}h2{font-size:18px;margin:0 0 22px}h3{font-size:15px}.sub{font-size:13px;color:#74816a;line-height:1.7;margin:0 0 28px}label{display:block;font-size:12px;font-weight:700;margin:20px 0 8px}input:not([type=checkbox]),textarea,select{width:100%;border:1px solid #cbd3c2;padding:12px;border-radius:5px;background:#fcfdfb;color:#27371c}textarea{min-height:86px;resize:vertical}input[type=checkbox]{accent-color:#558410;width:18px;height:18px;vertical-align:middle;margin-right:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:22px}.preview{width:100%;height:190px;object-fit:cover;border-radius:6px;background:#20251b;margin:10px 0}.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.upload input{font-size:12px}.note{font-size:11px;color:#74816a;line-height:1.7}.item{border:1px solid #dbe0d5;border-radius:8px;padding:22px;margin:16px 0}.item-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.item-head strong{overflow-wrap:anywhere}.item-head button{padding:7px 10px;font-size:12px}.danger{color:#a14437}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.stat{background:#f1eee8;border-radius:6px;padding:20px}.stat b{display:block;font-size:28px;margin-bottom:8px}.stat span{font-size:11px;color:#6e7f5f}.toast{position:fixed;bottom:25px;right:25px;max-width:calc(100vw - 50px);background:#1f3018;color:#fff;padding:15px 22px;border-radius:7px;box-shadow:0 8px 40px #0002;z-index:20}.toast.error{background:#863a30}.dirty{font-size:11px;color:#78353a}.help{padding:18px;background:#f2ece4;border-radius:7px;font-size:12px;line-height:1.7}.hidden,[hidden]{display:none!important}.empty{padding:30px;background:#f0f4ea;border-radius:7px}.badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#7d9270}footer{font-size:11px;color:#78876e;padding:10px 0 30px}@media(max-width:780px){header{padding:15px 5%;align-items:flex-start}.brand{font-size:19px}.brand span{display:block;margin:5px 0}.actions{flex-wrap:wrap;justify-content:flex-end}.actions .btn{font-size:10px;padding:9px}.primary{font-size:12px}.layout{display:block;padding:20px 5%}.side{position:static;display:flex;gap:5px;overflow-x:auto;padding-bottom:15px}.side button{white-space:nowrap;width:auto;padding:12px;font-size:12px}.side p{display:none}.panel{padding:22px}.row{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:14px}.stat b{font-size:24px}.stat span{font-size:10px}.item{padding:16px}.item-head{flex-wrap:wrap}.dirty{display:none}h1{font-size:26px}}
header .brand span,header .dirty{color:#dec3bd}.icon{display:inline-block;width:16px;height:16px;vertical-align:middle;fill:none;stroke:currentColor;flex-shrink:0}.item-head button .icon{width:14px;height:14px}@media(max-width:780px){input:not([type=checkbox]),textarea,select{font-size:16px;line-height:1.5}.item-head button{min-width:36px;min-height:36px}.side button{min-height:44px}header .primary{min-height:42px}}</style><style>__ADMIN_THEME__</style></head><body><header><a class="brand" href="/admin">GT / <span>УПРАВЛЕНИЕ САЙТОМ</span></a><div class="actions"><span class="dirty" id="dirty">Все изменения сохранены</span><a href="/" target="_blank" class="btn">Открыть сайт ↗</a><button class="primary" id="save">Сохранить</button></div></header><div class="layout"><aside class="side"><button class="active" data-tab="overview">Обзор</button><button data-tab="main">Главная и студия</button><button data-tab="about">О студии</button><button data-tab="services">Услуги и цены</button><button data-tab="gallery">Фотографии</button><button data-tab="promo">Акция</button><button data-tab="contacts">Контакты</button><button data-tab="backup">Резервная копия</button><p>GT Detailing.<br>Вход — через аккаунт владельца ChatGPT. Изменения сохраняются на сервере.</p></aside><main><div id="loading" class="panel">Загружаем настройки…</div><div id="editor" hidden></div><footer>GT Detailing · Управление сайтом</footer></main></div><div class="toast" id="toast" hidden role="status"></div><script>
let data,revision,dirty=false,tab='overview',saving=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t,error=false){$('#toast').textContent=t;$('#toast').className='toast'+(error?' error':'');$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,6000)}function mark(){dirty=true;$('#dirty').textContent='Есть несохранённые изменения';$('#save').textContent='Сохранить изменения'}function field(k,label,area=false){return '<label for="f-'+k+'">'+label+'</label><'+(area?'textarea':'input')+' id="f-'+k+'" data-key="'+k+'" '+(area?'':'type="'+(k==='phone'?'tel':k==='email'?'email':k==='experienceYears'?'number':'text')+'" value="'+esc(data[k])+'" maxlength="500"')+'>'+(area?esc(data[k])+'</textarea>':'')}function photo(k,label){return '<label>'+label+'</label><img class="preview" src="'+esc(data[k])+'" alt="'+label+'"><div class="upload"><input type="file" accept="image/jpeg,image/png,image/webp" data-upload="'+k+'" aria-label="'+label+'"></div>'}function shell(title,sub,body){return '<div class="panel"><p class="section-kicker">GT / ПАНЕЛЬ УПРАВЛЕНИЯ</p><h1>'+title+'</h1><p class="sub">'+sub+'</p>'+body+'</div>'}
function servicePhoto(s,i){return '<label>Фото услуги</label><img class="preview" src="'+esc(s.image||'/assets/studio.webp')+'" alt="'+esc(s.title)+'"><input type="file" accept="image/jpeg,image/png,image/webp" data-upload="service" data-i="'+i+'" aria-label="Фото услуги '+esc(s.title)+'">'}
function category(g,i){return '<label>Категория<select data-list="gallery" data-i="'+i+'" data-prop="category">'+[['body','Кузов'],['interior','Интерьер'],['studio','Студия']].map(v=>'<option value="'+v[0]+'" '+((g.category||'body')===v[0]?'selected':'')+'>'+v[1]+'</option>').join('')+'</select></label>'}
function render(){let html='';if(tab==='overview')html=shell('Управление сайтом','Фотографии, услуги и контакты — в одном месте.','<div class="stats"><div class="stat"><b>'+data.services.filter(x=>x.visible).length+'</b><span>услуг на сайте</span></div><div class="stat"><b>'+data.gallery.filter(x=>x.visible).length+'</b><span>фотографий в галерее</span></div><div class="stat"><b>'+(data.promoVisible?'Вкл.':'Выкл.')+'</b><span>блок акции</span></div></div><div class="quick-links"><button data-open="main">Первый экран<small>Заголовок, описание и фотографии</small></button><button data-open="services">Услуги и стоимость<small>Предложения, порядок и видимость</small></button><button data-open="gallery">Галерея работ<small>Фотографии и подписи</small></button><button data-open="contacts">Контакты студии<small>Телефон, адрес и Telegram</small></button></div><div class="help">Выберите раздел слева, внесите изменения и нажмите «Сохранить». Затем откройте сайт: обновления доступны и на других устройствах.<br><br>Здесь управляют содержанием сайта. Запись и обсуждение заказов идут в Telegram студии.</div>');
if(tab==='main')html=shell('Главная и студия','Первое впечатление: заголовок, описание и фотографии.',field('heroTitle','Заголовок первого экрана — каждая строка с новой строки',true)+field('heroText','Описание первого экрана',true)+'<div class="row"><div>'+photo('heroImage','Фотография первого экрана')+'</div><div>'+photo('studioImage','Фотография блока студии')+'</div></div><div class="row"><div>'+photo('studioPageImage','Фон страницы «О студии»')+'</div><div>'+photo('contactImage','Фотография в контактах')+'</div></div>'+field('studioTitle','Заголовок блока студии')+field('studioText','Текст о студии',true)+'<p class="note">1. Выберите фотографию. 2. Дождитесь загрузки. 3. Нажмите «Сохранить изменения». Затем откройте сайт в новой вкладке.<br>JPG, PNG или WebP до 5 МБ. Для главного экрана лучше горизонтальный кадр.</p>');
if(tab==='about')html=shell('О студии','Публикуйте только подтверждённые сведения. Сейчас стаж 12 лет указан на действующем сайте GT Detailing.',field('experienceYears','Опыт работы — число лет')+field('historyText','История и опыт студии',true)+field('studioTitle','Заголовок блока о студии')+field('studioText','Описание студии',true));
if(tab==='services')html=shell('Услуги и цены','Меняйте описание и цену. Стрелками задавайте порядок. Скрытые услуги не видны посетителям.',data.services.map((s,i)=>'<div class="item"><div class="item-head"><strong>'+esc(s.title)+'</strong><div><button data-action="up-service" data-i="'+i+'" '+(i===0?'disabled':'')+' aria-label="Выше">↑</button> <button data-action="down-service" data-i="'+i+'" '+(i===data.services.length-1?'disabled':'')+' aria-label="Ниже">↓</button> <button class="danger" data-action="delete-service" data-i="'+i+'">Удалить</button></div></div><label>Название<input data-list="services" data-i="'+i+'" data-prop="title" value="'+esc(s.title)+'" maxlength="100"></label>'+servicePhoto(s,i)+'<label>Описание<textarea data-list="services" data-i="'+i+'" data-prop="description" maxlength="500">'+esc(s.description)+'</textarea></label><label>Цена или подпись<input data-list="services" data-i="'+i+'" data-prop="price" value="'+esc(s.price)+'" maxlength="100"></label><label><input type="checkbox" data-list="services" data-i="'+i+'" data-prop="visible" '+(s.visible?'checked':'')+'>Показывать на сайте</label></div>').join('')+'<button data-action="add-service">+ Добавить услугу</button>');
if(tab==='gallery')html=shell('Фотографии','Загружайте реальные фотографии студии и работ. Подписи можно менять.',data.gallery.map((g,i)=>'<div class="item"><div class="item-head"><strong>Фотография '+(i+1)+'</strong><div><button data-action="up-photo" data-i="'+i+'" '+(i===0?'disabled':'')+' aria-label="Выше">↑</button> <button data-action="down-photo" data-i="'+i+'" '+(i===data.gallery.length-1?'disabled':'')+' aria-label="Ниже">↓</button> <button class="danger" data-action="delete-photo" data-i="'+i+'">Удалить</button></div></div><img class="preview" src="'+esc(g.image)+'" alt="'+esc(g.title)+'"><input type="file" accept="image/jpeg,image/png,image/webp" data-upload="gallery" data-i="'+i+'" aria-label="Заменить фотографию '+(i+1)+'"><label>Подпись<input data-list="gallery" data-i="'+i+'" data-prop="title" maxlength="100" value="'+esc(g.title)+'"></label>'+category(g,i)+'<label><input type="checkbox" data-list="gallery" data-i="'+i+'" data-prop="visible" '+(g.visible?'checked':'')+'>Показывать на сайте</label></div>').join('')+'<button data-action="add-photo">+ Добавить фотографию</button><p class="note">JPG, PNG, WebP до 5 МБ. После загрузки обязательно сохраните изменения.</p>');
if(tab==='promo')html=shell('Акция','Включите отдельную полосу с предложением над содержимым страниц. Условия должны быть актуальными.','<label><input type="checkbox" data-key="promoVisible" '+(data.promoVisible?'checked':'')+'>Показывать акцию</label>'+field('promoTitle','Заголовок')+field('promoText','Подпись ссылки на запрос расчёта'));
if(tab==='contacts')html=shell('Контакты','Эти данные используются в шапке, подвале и кнопках связи.',field('phone','Телефон')+field('telegram','Telegram студии — https://t.me/username')+field('address','Адрес')+field('hours','Режим работы')+field('email','Электронная почта')+'<p class="note">Проверьте номер и ссылку перед сохранением. Адрес также используется для построения маршрута.</p>');
if(tab==='backup')html=shell('Резервная копия','Скачайте настройки перед большими изменениями или восстановите ранее сохранённую копию.','<button data-action="export">Скачать настройки JSON</button><label for="restore">Восстановить из файла</label><input id="restore" type="file" accept="application/json,.json"><p class="note">Импорт загружает настройки в редактор. Чтобы применить их к сайту, нажмите «Сохранить». Фотографии хранятся на сервере отдельно.</p><div class="help">Копия содержит тексты, настройки и ссылки на загруженные фотографии. Это не архив самих изображений. Резервные версии настроек дополнительно сохраняются на сервере при каждом обновлении.</div>');$('#editor').innerHTML=html;$('#editor').hidden=false;document.querySelectorAll('[data-tab]').forEach(b=>(b.classList.toggle('active',b.dataset.tab===tab),b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#editor').addEventListener('input',e=>{const t=e.target;if(t.dataset.key){data[t.dataset.key]=t.type==='checkbox'?t.checked:t.value;mark()}if(t.dataset.list){data[t.dataset.list][Number(t.dataset.i)][t.dataset.prop]=t.type==='checkbox'?t.checked:t.value;mark()}});
$('#editor').addEventListener('change',async e=>{const t=e.target;if(t.id==='restore'){try{const v=JSON.parse(await t.files[0].text());if(!v.services||!v.gallery||!v.heroTitle)throw Error('Неверный формат');if(!confirm('Загрузить настройки из резервной копии?'))return;data=v;mark();render();toast('Копия загружена. Проверьте и сохраните.')}catch{toast('Не удалось прочитать резервную копию',true)}return}if(!t.dataset.upload||!t.files[0])return;const f=t.files[0];if(f.size>5*1024*1024)return toast('Файл больше 5 МБ',true);t.disabled=true;try{toast('Загружаем фотографию…');const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':f.type,'X-GT-Admin':'1'},body:f});const result=await r.json();if(!r.ok)throw Error(result.error||'Ошибка загрузки');if(t.dataset.upload==='gallery')data.gallery[Number(t.dataset.i)].image=result.url;else if(t.dataset.upload==='service')data.services[Number(t.dataset.i)].image=result.url;else data[t.dataset.upload]=result.url;mark();render();toast('Фотография загружена. Нажмите «Сохранить».')}catch(err){toast(err.message,true);t.disabled=false}});
$('#editor').addEventListener('click',e=>{const quick=e.target.closest('[data-open]');if(quick){tab=quick.dataset.open;render();window.scrollTo({top:0});return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=Number(b.dataset.i);if(a==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='gt-detailing-settings.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}const list=a.includes('service')?data.services:data.gallery;if(a.startsWith('delete')){if(!confirm('Удалить этот элемент? Изменение применится после сохранения.'))return;list.splice(i,1)}if(a.startsWith('up')&&i>0)[list[i-1],list[i]]=[list[i],list[i-1]];if(a.startsWith('down')&&i<list.length-1)[list[i+1],list[i]]=[list[i],list[i+1]];if(a==='add-service'){if(data.services.length>=20)return toast('Максимум 20 услуг',true);data.services.push({slug:'service-'+crypto.randomUUID().slice(0,8),title:'Новая услуга',description:'Описание услуги',price:'По запросу',visible:false})}if(a==='add-photo'){if(data.gallery.length>=20)return toast('Максимум 20 фотографий',true);data.gallery.push({title:'Новая фотография',image:'/assets/studio.webp',category:'body',visible:false})}mark();render()});
$('#save').onclick=async()=>{if(saving||!data)return;saving=true;$('#save').disabled=true;try{const r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json','X-GT-Admin':'1','If-Match':revision},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'Не удалось сохранить');revision=result.revision;dirty=false;$('#dirty').textContent='Все изменения сохранены';$('#save').textContent='Сохранить';toast('Сохранено на сервере. Сайт обновлён.')}catch(e){toast(e.message,true)}finally{saving=false;$('#save').disabled=false}};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});fetch('/api/content',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('Нет доступа к настройкам');return r.json()}).then(r=>{data=r.content;revision=r.revision;$('#loading').hidden=true;render()}).catch(e=>{$('#loading').textContent=e.message;toast('Обновите страницу или войдите в аккаунт владельца.',true)});
</script></body></html>
